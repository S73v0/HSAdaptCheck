name: Independent core
on: [push, pull_request]
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore HSAdaptCheck.sln --locked-mode
      - run: dotnet build HSAdaptCheck.sln -c Release --no-restore
      - run: dotnet run --project tests/HSAdaptCheck.Tests -c Release --no-build
